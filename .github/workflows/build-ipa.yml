name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    # macOS runner is only used to compile. Nothing is signed, no Apple ID,
    # certificate or provisioning profile is involved.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build for device (unsigned)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project MaiPanel.xcodeproj \
            -scheme MaiPanel \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP="app/build/Build/Products/Release-iphoneos/MaiPanel.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry MaiPanel-unsigned.ipa Payload

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: app/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MaiPanel-unsigned
          path: MaiPanel-unsigned.ipa
          if-no-files-found: error
